name: Deploy Cloudflare civilization

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-civilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify city and neural behavior
        run: npm install --prefix worker --ignore-scripts --no-package-lock && npm run test:city

      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CI deployment skipped: repository Cloudflare credentials are absent. Deploy with the authorized local Wrangler login."
            echo "Worker tests passed; automatic deployment was skipped because repository Cloudflare credentials are absent." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Durable Object worker
        if: steps.credentials.outputs.ready == 'true'
        run: npm run deploy:civilization:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
