name: Deploy Cloudflare civilization

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-civilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify city and neural behavior
        run: npm run test:city

      - name: Deploy Durable Object worker
        run: npm run deploy:civilization:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
